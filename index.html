<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="James Foster — software engineer and cognitive scientist working on AI agents and analogical reasoning.">
  <title>James Foster</title>
  <style>
    :root {
      --text: #1a1a1a;
      --muted: #6a6a6a;
      --accent: #2a4a7a;
      --bg: #fdfdfa;
      --rule: #e0e0d8;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: var(--text);
      background: var(--bg);
      max-width: 42rem;
      margin: 0 auto;
      padding: 4rem 1.5rem 6rem;
      line-height: 1.6;
      font-size: 17px;
    }
    h1 {
      font-size: 1.75rem;
      margin: 0 0 0.25rem;
      letter-spacing: -0.01em;
    }
    .tagline {
      color: var(--muted);
      margin-bottom: 2.5rem;
      font-size: 1.05rem;
    }
    a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid currentColor;
    }
    a:hover { background: rgba(42, 74, 122, 0.08); }
    footer {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid var(--rule);
    }
    footer p { margin: 0 0 0.5rem; }
  </style>
</head>
<body>

<h1>James Foster</h1>
<p class="tagline">Software engineer + cognitive scientist · AI agents, analogical reasoning, and the engineering of thinking tools.</p>

<footer>
  <p>Madison, Wisconsin</p>
  <p>
    <a href="https://github.com/jmfoster">GitHub</a> ·
    <a href="https://www.linkedin.com/in/fosterjm">LinkedIn</a> ·
    <a href="mailto:jmfoster@gmail.com">jmfoster@gmail.com</a>
  </p>
</footer>

</body>
</html>
